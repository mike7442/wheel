[env:esp32s3_native_usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Включаем нативный USB как COM-порт
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ИСПОЛЬЗУЕМ ОБЫЧНЫЙ ЗАГРУЗЧИК, а не JTAG!
upload_protocol = esptool

; Отключаем дергание линий сброса при открытии монитора
monitor_dtr = 0
monitor_rts = 0
monitor_speed = 115200
monitor_eol = LF